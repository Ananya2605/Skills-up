<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>AI Placement Intelligence</title>

<!-- ✅ IMPORTANT FOR MOBILE -->
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<!-- GOOGLE FONT -->
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">

<style>

/* RESET */
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family: 'Poppins', sans-serif;
}

/* BACKGROUND */
body{
    background: radial-gradient(circle at top, #0f172a, #020617);
    color: #e2e8f0;
}

/* MAIN CONTAINER */
.home-container{
    min-height: 100vh;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    text-align:center;
    padding:20px;
}

/* TITLE */
h1{
    font-size: clamp(26px, 5vw, 48px);
    margin-bottom:10px;
}

/* SUBTEXT */
p{
    font-size: clamp(14px, 2vw, 18px);
    color:#94a3b8;
    margin-bottom:30px;
}

/* FEATURES GRID */
.features{
    display:flex;
    gap:20px;
    margin-bottom:30px;
}

/* FEATURE CARDS */
.feature-card{
    text-decoration:none;
    color:white;
    background: rgba(255,255,255,0.05);
    padding:18px 22px;
    border-radius:12px;
    transition:0.3s;
    border:1px solid rgba(255,255,255,0.1);
    backdrop-filter: blur(10px);
}

/* HOVER EFFECT */
.feature-card:hover{
    transform: translateY(-5px);
    background: rgba(236,72,153,0.15);
    border-color:#ec4899;
}

/* BUTTON */
.start-btn{
    padding:14px 30px;
    font-size:16px;
    border:none;
    border-radius:8px;
    background: linear-gradient(135deg,#06b6d4,#22c55e);
    color:white;
    cursor:pointer;
    transition:0.3s;
}

.start-btn:hover{
    transform:scale(1.05);
}

/* ✅ MOBILE FIX */
@media (max-width: 768px){

    .features{
        flex-direction:column;
        width:100%;
        align-items:center;
    }

    .feature-card{
        width:90%;
        text-align:center;
    }

    .start-btn{
        width:80%;
        font-size:18px;
    }
}

</style>
</head>

<body>

<div class="home-container">

    <h1>🏙️ AI Placement Intelligence</h1>
    <p>Your Smart Career Guidance Platform</p>

    <div class="features">

        <a href="analyze.html" class="feature-card">
            📊 Analyze your skills
        </a>

        <a href="connections.html" class="feature-card">
            🤝 Find connections
        </a>

        <a href="improve.html" class="feature-card">
            🚀 Improve placement chances
        </a>

    </div>

    <a href="home.html">
        <button class="start-btn">Get Started</button>
    </a>

</div>

</body>
</html>
