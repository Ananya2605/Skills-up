<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Skill Analyzer</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family: 'Segoe UI', sans-serif;
}

body {
    background: linear-gradient(135deg,#0f172a,#020617);
    color: white;
    text-align: center;
    padding: 15px;
}

/* HEADING */
h2 {
    color: #ec4899;
    margin-bottom: 15px;
    font-size: 22px;
}

/* INPUT + BUTTON */
input, button {
    width: 100%;
    max-width: 400px;
    padding: 12px;
    margin: 8px auto;
    border-radius: 10px;
    border: none;
    font-size: 16px;
    display: block;
}

input {
    background: #1e293b;
    color: white;
}

button {
    background: #ec4899;
    color: white;
    cursor: pointer;
    transition: 0.3s;
}

button:hover {
    background: #db2777;
}

/* CARD */
.card {
    background: rgba(30,41,59,0.8);
    backdrop-filter: blur(10px);
    padding: 18px;
    margin: 18px auto;
    width: 100%;
    max-width: 420px;
    border-radius: 15px;
    text-align: left;
    box-shadow: 0 10px 25px rgba(0,0,0,0.4);
}

/* PROGRESS */
.progress {
    height: 18px;
    background: #334155;
    border-radius: 10px;
    overflow: hidden;
    margin-top: 10px;
}

.bar {
    height: 100%;
    background: linear-gradient(to right,#22c55e,#4ade80);
    width: 0%;
    transition: 0.5s;
}

/* HISTORY */
.history {
    margin-top: 25px;
}

.history h3 {
    margin-bottom: 10px;
}

/* MOBILE */
@media (max-width: 480px){

    h2{
        font-size: 20px;
    }

    input, button{
        font-size: 15px;
        padding: 10px;
    }

    .card{
        padding: 15px;
    }
}

</style>

</head>

<body>

<h2>📊 AI Skill Analyzer</h2>

<input type="text" id="skills" placeholder="Enter skills (python, html, ml)">
<button onclick="analyze()">Analyze</button>

<div id="output"></div>

<div class="history">
    <h3>📜 Previous Analysis</h3>
    <div id="history"></div>
</div>

<script>

// LOAD HISTORY
let historyData = JSON.parse(localStorage.getItem("analysis")) || {};

// MARKET DATA
const skillMarket = {
    "python": { demand: "High", salary: "6–15 LPA", role: "AI / Backend Developer" },
    "machine learning": { demand: "Very High", salary: "8–25 LPA", role: "AI Engineer" },
    "ai": { demand: "Very High", salary: "10–30 LPA", role: "AI Specialist" },
    "html": { demand: "Medium", salary: "3–8 LPA", role: "Frontend Developer" },
    "css": { demand: "Medium", salary: "3–8 LPA", role: "Frontend Developer" },
    "javascript": { demand: "High", salary: "5–18 LPA", role: "Full Stack Developer" },
    "react": { demand: "High", salary: "6–20 LPA", role: "Frontend Developer" },
    "node": { demand: "High", salary: "6–18 LPA", role: "Backend Developer" },
    "java": { demand: "High", salary: "5–15 LPA", role: "Software Developer" },
    "c++": { demand: "Medium", salary: "4–12 LPA", role: "Software Engineer" },
    "dsa": { demand: "Very High", salary: "8–30 LPA", role: "Top Product Companies" },
    "sql": { demand: "High", salary: "5–12 LPA", role: "Data Analyst" },
    "cyber security": { demand: "High", salary: "6–20 LPA", role: "Security Analyst" },
    "cloud": { demand: "Very High", salary: "10–25 LPA", role: "Cloud Engineer" }
};

// NORMALIZE
function normalize(skill){
    skill = skill.trim().toLowerCase();

    if(skill === "ml") return "machine learning";
    if(skill === "js") return "javascript";

    return skill;
}

// ANALYZE
function analyze(){

    let input = document.getElementById("skills").value;

    if(!input){
        alert("Enter skills first!");
        return;
    }

    let skills = input.split(",").map(normalize);

    let results = [];
    let totalScore = 0;

    skills.forEach(skill => {

        if(skillMarket[skill]){

            let data = skillMarket[skill];

            results.push(`
                <p>✅ <b>${skill.toUpperCase()}</b><br>
                📈 Demand: ${data.demand}<br>
                💰 Salary: ${data.salary}<br>
                🎯 Role: ${data.role}</p>
            `);

            if(data.demand === "Very High") totalScore += 30;
            else if(data.demand === "High") totalScore += 20;
            else totalScore += 10;

        } else {

            results.push(`
                <p>⚠️ <b>${skill}</b><br>
                No strong data available.<br>
                Suggestion: Learn relevant frameworks.</p>
            `);

            totalScore += 5;
        }
    });

    let avg = Math.min(totalScore, 100);

    let level =
        avg >= 25 ? "🏆 High Market Value" :
        avg >= 10 ? "🥈 Moderate Value" :
        "🥉 Low Value";

    document.getElementById("output").innerHTML = `
        <div class="card">
            <h3>${level}</h3>

            <p><b>📊 Overall Score:</b> ${avg}%</p>

            <div class="progress">
                <div class="bar" style="width:${avg}%"></div>
            </div>

            <hr style="margin:10px 0; border-color:#334155;">

            ${results.join("")}

            <p style="font-size:12px; opacity:0.7;">
            *Based on current market trends
            </p>
        </div>
    `;

    // SAVE HISTORY
    historyData.unshift({input, score: avg});
    localStorage.setItem("analysis", JSON.stringify(historyData));

    renderHistory();
}

// HISTORY
function renderHistory(){

    let html = "";

    historyData.slice(0,5).forEach(h=>{
        html += `
            <div class="card">
                <p><b>Skills:</b> ${h.input}</p>
                <p><b>Score:</b> ${h.score}%</p>
            </div>
        `;
    });

    document.getElementById("history").innerHTML = html;
}

// INIT
renderHistory();

</script>

</body>
</html>
